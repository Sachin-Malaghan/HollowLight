; EMBERHOME engine configuration. See CLAUDE.md.

[/Script/EngineSettings.GameMapsSettings]
; No authored maps: the engine's empty Entry map hosts the game; the HUD draws everything.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/Hollowlight.HLGameMode

[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.AmbientOcclusion=False
r.AntiAliasingMethod=0
r.Mobile.AntiAliasing=0
r.MobileHDR=False
r.GenerateMeshDistanceFields=False
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0
r.Nanite.ProjectEnabled=False
r.RayTracing=False

[SystemSettings]
; Canvas-only game: render at the device's native resolution so lines stay crisp on phones.
r.MobileContentScaleFactor=0


[/Script/Engine.AudioSettings]
DefaultAudioCompressionType=Opus

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
PackageName=com.brainrotinteractive.emberhome
StoreVersion=4
VersionDisplayName=2.0.0
ApplicationDisplayName=Emberhome
MinSDKVersion=26
TargetSDKVersion=36
; Google Play wants an Android App Bundle (.aab); the universal APK next to it is for sideload testing.
bEnableBundle=True
bEnableUniversalAPK=True
bBundleABISplit=True
; Release signing (KeyStore, KeyAlias, KeyStorePassword) lives in Config/Android/AndroidEngine.ini,
; written by Tools/Build/create_upload_key.ps1 and git-ignored. Never put the password in this file.
Orientation=SensorLandscape
bPackageDataInsideApk=True
bFullScreen=True
bBuildForArm64=True
bBuildForX8664=False
bSupportsVulkan=True
bBuildForES31=True
bEnableGooglePlaySupport=False
; No ads in this game: without this, Unreal bundles the AdMob SDK and Play Console reports the app as containing ads.
bSupportAdMob=False
bShowLaunchImage=False
bEnableNewKeyboard=True
; Draw into the camera-notch area so the rendered image and touch positions share one origin
; (without it, phones with a cutout letterbox the game and taps land off-target). The UI keeps
; clear of the notch through the safe-area insets.
bUseDisplayCutout=True
; The default (2.1) letterboxes modern 20:9+ phones, and touches are then mapped against the full
; screen, landing to the right of the finger. The game adapts to any width, so allow very wide screens.
MaxAspectRatio=3.0

